[build-system]
requires = ["setuptools>=68", "cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "polymarket-bt"
version = "1.0.0"
description = "Pipeline ultra-rápido de backtest para mercados Polymarket 15m (BTC/ETH/SOL/XRP)"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "cython>=3.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "orjson>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ipython",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.cy" = ["*.pyx", "*.pxd"]
